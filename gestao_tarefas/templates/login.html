{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-4">

            <div class="card shadow p-4">

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Usuário</label>

                        <input 
                            type="text" 
                            name="username" 
                            class="form-control"
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>

                        <input 
                            type="password" 
                            name="password" 
                            class="form-control"
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
