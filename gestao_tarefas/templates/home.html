{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">


    <p>Olá, <strong>{{ user.username }}</strong>!</p>

    <div class="row mt-4">

        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Total</h5>
                    <h2>{{ total }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Pendentes</h5>
                    <h2>{{ pendentes }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Em Andamento</h5>
                    <h2>{{ andamento }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5>Concluídas</h5>
                    <h2>{{ concluidas }}</h2>
                </div>
            </div>
        </div>

    </div>

    

</div>
{% endblock %}
